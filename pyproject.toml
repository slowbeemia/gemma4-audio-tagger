[project]
name = "gemma4-audio-tagger"
version = "0.1.0"
description = "Batch audio tagging pipeline using Gemma 4 12B via HuggingFace Transformers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "torch>=2.5.0",
    "torchvision",
    "transformers>=4.55.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pillow",
]

[tool.uv]
package = false
